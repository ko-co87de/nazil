name: Build Nazil APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;34.0.0" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore nazil.keystore \
            -alias nazil \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nazil123 -keypass nazil123 \
            -dname "CN=Nazil, OU=Dev, O=Nazil, L=Baghdad, ST=Baghdad, C=IQ"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/release/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nazil-arm64-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
